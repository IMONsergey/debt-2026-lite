name: Experimental branch audit

on:
  push:
    branches: [experiments/hero-raycolumn-2026-09-11]
  workflow_dispatch:
    inputs:
      preview_url:
        description: Optional preview URL for browser verification
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: branch-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.ref == 'refs/heads/experiments/hero-raycolumn-2026-09-11'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Archive audited source
        run: |
          mkdir -p audit-output
          git archive HEAD -o audit-output/source.zip
          git rev-parse HEAD > audit-output/commit.txt
      - run: npm ci
      - name: Build preview without Pages base path
        run: npm run build 2>&1 | tee audit-output/build.log
        env:
          GITHUB_ACTIONS: 'false'
      - name: Browser tooling (not shipped)
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve build
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
      - name: Record browser evidence
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const browser = await chromium.launch({ args: ['--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader'] });
          const targets = [{ name: 'local', url: 'http://127.0.0.1:4173/' }];
          if (process.env.PREVIEW_URL) targets.push({ name: 'vercel', url: process.env.PREVIEW_URL });
          for (const target of targets) {
            for (const viewport of [{ width: 1440, height: 1000 }, { width: 1920, height: 1080 }, { width: 768, height: 1024 }, { width: 390, height: 844 }]) {
              const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
              const errors = [], failed = [];
              page.on('pageerror', e => errors.push(e.message));
              page.on('response', r => { if (r.status() >= 400) failed.push({ url: r.url().split('?')[0], status: r.status() }); });
              await page.goto(target.url, { waitUntil: 'networkidle', timeout: 90000 });
              await page.evaluate(() => document.fonts.ready);
              await page.waitForTimeout(1200);
              const name = `${target.name}-${viewport.width}`;
              await page.screenshot({ path: `audit-output/${name}-hero.png` });
              const metrics = await page.evaluate(() => {
                const rect = el => {
                  const r = el.getBoundingClientRect(), s = getComputedStyle(el);
                  return { tag: el.tagName, class: el.className?.baseVal ?? el.className, id: el.id, x: r.x, y: r.y, width: r.width, height: r.height, display: s.display, position: s.position, zIndex: s.zIndex, color: s.color, background: s.background, fontSize: s.fontSize, lineHeight: s.lineHeight, padding: s.padding, gap: s.gap };
                };
                return { title: document.title, width: innerWidth, scrollWidth: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight, hero: [...document.querySelectorAll('.hero-placeholder, .hero-placeholder *, aside, nav, [class*="menu"], [class*="timer"], [class*="countdown"]')].map(rect), buttons: [...document.querySelectorAll('button, a[class*="btn"], a[class*="button"], a[class*="cta"]')].map(el => ({ ...rect(el), text: el.textContent.trim() })), images: [...document.images].filter(im => im.getBoundingClientRect().top < innerHeight).map(im => ({ src: im.currentSrc.split('?')[0], width: im.naturalWidth, height: im.naturalHeight })), stylesheets: [...document.styleSheets].map(s => s.href) };
              });
              for (const section of await page.locator('section[id]').all()) {
                await section.scrollIntoViewIfNeeded();
                await page.waitForTimeout(250);
              }
              await page.screenshot({ path: `audit-output/${name}-full.png`, fullPage: true });
              await fs.writeFile(`audit-output/${name}.json`, JSON.stringify({ ...metrics, errors, failed }, null, 2));
              await page.close();
            }
          }
          await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branch-audit-${{ github.sha }}
          path: audit-output/
          retention-days: 7
