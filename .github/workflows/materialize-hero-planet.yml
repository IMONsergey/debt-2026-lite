name: Materialize hero planet and verify preview branch

on:
  push:
    branches: [experiments/hero-raycolumn-2026-09-11]
    paths:
      - '.handoff/planet/**'
      - '.github/workflows/materialize-hero-planet.yml'

permissions:
  contents: write

jobs:
  materialize-and-verify:
    if: github.ref == 'refs/heads/experiments/hero-raycolumn-2026-09-11'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Materialize supplied hero planet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/hero-experiment
          cat .handoff/planet/chunk.* > /tmp/planet.b64
          base64 -d /tmp/planet.b64 > public/assets/hero-experiment/planet.webp
          test "$(head -c 4 public/assets/hero-experiment/planet.webp)" = "RIFF"
          test "$(dd if=public/assets/hero-experiment/planet.webp bs=1 skip=8 count=4 status=none)" = "WEBP"
          test "$(wc -c < public/assets/hero-experiment/planet.webp)" -gt 15000

      - name: Remove superseded experiment files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .handoff/planet
          rm -f .github/workflows/audit-workbench.yml
          rm -f src/components/CosmosPointerEffect.jsx src/styles/cosmos-effect.css
          rm -rf src/assets/hero-planet
          rm -f public/assets/hero-experiment/back-pattern.svg
          rm -f public/assets/hero-debttech-2026.png public/assets/hero-debttech-2026-adaptive.png
          rm -f .github/workflows/materialize-hero-planet.yml

      - name: Install dependencies
        run: npm ci

      - name: Build Vercel scenario
        run: npm run build
        env:
          GITHUB_ACTIONS: 'false'

      - name: Commit verified materialized asset and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Materialize supplied hero planet and finish preview cleanup"
          git push origin HEAD:experiments/hero-raycolumn-2026-09-11
