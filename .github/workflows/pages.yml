name: Публикация сайта

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Публикация main + sandbox в GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Получить main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-site

      - name: Получить sandbox
        uses: actions/checkout@v4
        with:
          ref: site-sandbox
          path: sandbox-site

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            main-site/package-lock.json
            sandbox-site/package-lock.json

      - name: Установить зависимости main
        working-directory: main-site
        run: npm ci

      - name: Собрать main
        working-directory: main-site
        run: npm run build -- --base=/debt-2026-lite/

      - name: Установить зависимости sandbox
        working-directory: sandbox-site
        run: npm ci

      - name: Собрать sandbox
        working-directory: sandbox-site
        run: npm run build -- --base=/debt-2026-lite/sandbox/

      - name: Собрать единый Pages-артефакт
        run: |
          mkdir -p publish/sandbox
          cp -a main-site/dist/. publish/
          cp -a sandbox-site/dist/. publish/sandbox/

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Подготовить сайт к публикации
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./publish

      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
