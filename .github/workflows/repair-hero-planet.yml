name: Repair hero planet binary

on:
  push:
    branches: [experiments/hero-raycolumn-2026-09-11]
    paths:
      - '.handoff/planet/**'
      - '.github/workflows/repair-hero-planet.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/experiments/hero-raycolumn-2026-09-11'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Rebuild and verify exact planet asset
        shell: bash
        run: |
          set -euo pipefail
          cat .handoff/planet/chunk.* > /tmp/planet.b64
          base64 -d /tmp/planet.b64 > /tmp/planet.webp
          echo '74b89cd863a412c491546437105c4092f866b1db9e9de6c5c39da1395804036e  /tmp/planet.webp' | sha256sum -c -
          test "$(wc -c < /tmp/planet.webp)" -eq 22102
          test "$(head -c 4 /tmp/planet.webp)" = 'RIFF'
          test "$(dd if=/tmp/planet.webp bs=1 skip=8 count=4 status=none)" = 'WEBP'
          cp /tmp/planet.webp public/assets/hero-experiment/planet.webp
      - run: npm ci
      - name: Build Vercel scenario
        run: npm run build
        env:
          GITHUB_ACTIONS: 'false'
      - name: Commit verified binary and remove transfer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .handoff/planet
          rm -f .github/workflows/repair-hero-planet.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Repair supplied hero planet binary'
          git push origin HEAD:experiments/hero-raycolumn-2026-09-11
