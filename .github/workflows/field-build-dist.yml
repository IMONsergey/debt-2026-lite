name: Build FIELD static bundle

on:
  push:
    branches:
      - experiments/field-concept-vercel-2026-09-14
    paths:
      - .github/workflows/field-build-dist.yml

permissions:
  contents: write

jobs:
  build-field:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout FIELD branch
        uses: actions/checkout@v4
        with:
          ref: experiments/field-concept-vercel-2026-09-14
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build FIELD
        run: npm run build
        env:
          GITHUB_ACTIONS: 'false'

      - name: Stage standalone static bundle
        run: |
          rm -rf field-dist
          cp -R dist field-dist

      - name: Commit static bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f field-dist
          if git diff --cached --quiet; then
            echo "No bundle changes to commit"
            exit 0
          fi
          git commit -m "Build FIELD static bundle"
          git push origin HEAD:experiments/field-concept-vercel-2026-09-14
