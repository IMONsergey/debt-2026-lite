name: Prepare audit workbench
on:
  push:
    branches: [experiments/hero-raycolumn-2026-09-11]
    paths: [.github/workflows/audit-workbench.yml]
permissions:
  contents: read
jobs:
  package:
    if: github.ref == 'refs/heads/experiments/hero-raycolumn-2026-09-11'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_ACTIONS: 'false'
      - run: tar -czf workbench.tar.gz node_modules dist
      - uses: actions/upload-artifact@v4
        with:
          name: offline-audit-workbench
          path: workbench.tar.gz
          retention-days: 1
