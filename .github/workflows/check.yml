name: Проверка сайта

on:
  push:
    branches: [codex/global-layout-cleanup]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Проверить сборку с префиксом GitHub Pages
        run: npm run build -- --base=/debt-2026-lite/
