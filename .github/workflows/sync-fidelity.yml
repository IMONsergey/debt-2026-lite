name: Подготовка точной версии

on:
  push:
    branches:
      - fix/identichnaya-stranitsa
    paths:
      - '.github/workflows/sync-fidelity.yml'

permissions:
  contents: write

jobs:
  prepare:
    name: Перенос актуальной страницы
    runs-on: ubuntu-latest

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4
        with:
          ref: fix/identichnaya-stranitsa
          fetch-depth: 0

      - name: Получить основную версию сайта
        uses: actions/checkout@v4
        with:
          repository: IMONsergey/debttech2026
          ref: main
          path: source

      - name: Собрать исходники страницы
        shell: bash
        run: |
          set -euo pipefail

          rm -rf public src css js package.json package-lock.json vite.config.js
          mkdir -p public src/components src/lib src/styles src/assets/fonts

          cp -a assets public/assets
          cp source/src/components/SitePage.jsx src/components/SitePage.jsx
          cp source/src/components/FixedMenu.jsx src/components/FixedMenu.jsx
          cp source/src/components/CosmosPointerEffect.jsx src/components/CosmosPointerEffect.jsx
          cp source/src/lib/typography.js src/lib/typography.js

          cp source/src/styles/global.css src/styles/global.css
          cp source/src/styles/site-fidelity.css src/styles/site-fidelity.css
          cp source/src/styles/public-artwork.css src/styles/public-artwork.css
          cp source/src/styles/hero-only.css src/styles/hero-only.css
          cp source/src/styles/hero-only-media-fixes.css src/styles/hero-only-media-fixes.css
          cp source/src/styles/soft-reveal.css src/styles/soft-reveal.css
          cp source/src/styles/cosmos-effect.css src/styles/cosmos-effect.css
          cp source/src/styles/hero-mobile-grid-fix.css src/styles/hero-mobile-grid-fix.css

          cp -a source/Bounded src/assets/fonts/Bounded
          cp -a source/IBMPlexSans src/assets/fonts/IBMPlexSans

          sed -i "s|../../Bounded/|../assets/fonts/Bounded/|g; s|../../IBMPlexSans/|../assets/fonts/IBMPlexSans/|g" src/styles/global.css
          sed -i "s|'/assets/|'assets/|g; s|\"/assets/|\"assets/|g" src/components/SitePage.jsx src/components/FixedMenu.jsx

          cat > src/App.jsx <<'EOF'
          import { useEffect } from 'react';
          import { CosmosPointerEffect } from './components/CosmosPointerEffect.jsx';
          import { SitePage } from './components/SitePage.jsx';
          import './styles/hero-only.css';
          import './styles/hero-only-media-fixes.css';
          import './styles/soft-reveal.css';

          const galleryImages = [
            '01.webp', '02.webp', '03.webp', '04.webp', '05.webp',
            '06.webp', '07.webp', '08.webp', '09.webp', '10.jpg',
            '11.jpg', '12.jpg', '13.jpg', '14.jpg', '15.jpg',
            '16.jpg', '17.jpg', '18.jpg', '19.jpg', '20.jpg',
          ];

          const content = {
            pageMode: 'hero-landing',
            site: {
              title: 'DEBT TECH 2026',
              date: '13 ноября 2026',
              city: 'Москва',
              logo: 'assets/icons/debttech-logo.svg',
            },
            menu: {
              groups: [],
              cta: {
                label: 'Ранняя регистрация',
                href: 'https://t.me/anna_joys',
                modal: null,
              },
              secondaryCta: {
                label: 'Забронировать стенд',
                href: 'https://t.me/anna_joys',
                modal: null,
              },
              sidebar: {
                venueTitle: 'TAU - пространство\nмузыкальных культур',
                venueAddress: 'Москва, Рязанский проспект, 8Ас10',
                venueImage: 'assets/images/venue.webp',
                routeLabel: 'Смотреть на карте',
                routeHref: 'https://yandex.ru/maps/?text=%D0%9C%D0%BE%D1%81%D0%BA%D0%B2%D0%B0%2C%20%D0%A0%D1%8F%D0%B7%D0%B0%D0%BD%D1%81%D0%BA%D0%B8%D0%B9%20%D0%BF%D1%80%D0%BE%D1%81%D0%BF%D0%B5%D0%BA%D1%82%2C%208%D0%90%D1%8110',
                contactLabel: 'Контакты для связи',
                contactEmail: 'redchief@rvzrus.ru',
                organizersLabel: 'Организаторы',
                organizersImage: 'assets/icons/organizers.svg',
              },
            },
            hero: {
              title: 'DEBT TECH 2026',
              backgroundImage: 'assets/images/hero-desktop.png',
              backgroundImageAdaptive: 'assets/images/hero-mobile.png',
              bottomTitle: 'Стратегии, технологии и инновационные сервисы для работы с долговыми обязательствами',
              countdownLabel: 'Время до запуска',
              countdownTarget: '2026-11-13T00:00:00+03:00',
              countdown: [
                { value: '00', label: 'дней' },
                { value: '00', label: 'часов' },
                { value: '00', label: 'минут' },
                { value: '00', label: 'секунд' },
              ],
            },
            ticker: {
              items: [
                '800+ делегатов',
                '70+ спикеров',
                '50+ участников выставки',
                '3 сцены',
                'Креативная вечерняя программа',
                'Интерактивные зоны',
                'Пресс-бар',
                'Фуршет',
                'VIP-резиденции',
                'Afterparty',
              ],
            },
            heroVideo: {
              title: 'Как проходят наши конференции',
              embedUrl: 'https://kinescope.io/embed/oJuPdsugHShm1c43oRbGCj?t=20&transparent=true&autoplay=true&muted=true',
            },
            gallery: {
              title: 'Кадры с DEBT TECH 2025',
              ctaLabel: 'Смотреть все фото',
              href: 'https://rvz.bitrix24.ru/~0IZ9x',
              items: galleryImages.map((name, index) => ({
                image: `assets/images/gallery/${name}`,
                alt: `DEBT TECH 2025 — кадр ${index + 1}`,
              })),
            },
            footer: {
              copyright: '© 2026 DEBT TECH. Все права защищены.',
              privacyLabel: 'Политика конфиденциальности и персональных данных',
              privacyHref: 'https://rvzrus.ru/politic',
            },
          };

          export default function App() {
            useEffect(() => {
              document.title = 'DEBT TECH 2026 - Вселенная технологий | 13 ноября | Москва';
            }, []);

            return (
              <>
                <CosmosPointerEffect />
                <div className="hero-only-view">
                  <SitePage content={content} />
                </div>
              </>
            );
          }
          EOF

          cat > src/main.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import App from './App.jsx';
          import './styles/global.css';
          import './styles/site-fidelity.css';
          import './styles/public-artwork.css';
          import './styles/hero-mobile-grid-fix.css';

          createRoot(document.getElementById('root')).render(
            <React.StrictMode>
              <App />
            </React.StrictMode>,
          );
          EOF

          cat > package.json <<'EOF'
          {
            "name": "debt-2026-lite",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "vite build",
              "preview": "vite preview"
            },
            "dependencies": {
              "react": "^19.1.1",
              "react-dom": "^19.1.1"
            },
            "devDependencies": {
              "@vitejs/plugin-react": "^5.0.0",
              "vite": "^7.1.2"
            }
          }
          EOF

          cat > vite.config.js <<'EOF'
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';

          export default defineConfig({
            plugins: [react()],
            base: '/debt-2026-lite/',
          });
          EOF

          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="ru">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta name="theme-color" content="#01081f" />
              <meta name="description" content="DEBT TECH 2026 — форум-выставка о технологиях и сервисах для работы с долговыми обязательствами. 13 ноября 2026, Москва." />
              <link rel="icon" type="image/svg+xml" href="./assets/icons/debttech-logo.svg" />
              <title>DEBT TECH 2026 - Вселенная технологий | 13 ноября | Москва</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          EOF

          cat > .github/workflows/pages.yml <<'EOF'
          name: Публикация сайта

          on:
            push:
              branches:
                - main
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: pages
            cancel-in-progress: true

          jobs:
            deploy:
              name: Публикация в GitHub Pages
              runs-on: ubuntu-latest
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}

              steps:
                - name: Получить файлы
                  uses: actions/checkout@v4

                - name: Установить Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm

                - name: Установить зависимости
                  run: npm ci

                - name: Собрать сайт
                  run: npm run build

                - name: Настроить GitHub Pages
                  uses: actions/configure-pages@v5

                - name: Подготовить сайт к публикации
                  uses: actions/upload-pages-artifact@v4
                  with:
                    path: ./dist

                - name: Опубликовать сайт
                  id: deployment
                  uses: actions/deploy-pages@v4
          EOF

          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run build

          rm -rf source assets css js
          rm -f .github/workflows/sync-fidelity.yml

      - name: Сохранить изменения
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sergei I'MON"
          git config user.email "jabba.person@gmail.com"
          git add -A
          git commit -m "Привести страницу к основной версии"
          git push origin fix/identichnaya-stranitsa
